name: Architect Vulnerability Radar

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Send sample alerts now to verify Slack delivery'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write

concurrency:
  group: vuln-radar-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests feedparser

      - name: Run Architect Radar
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          TEST_MODE: ${{ github.event.inputs.test_mode || 'false' }}
        run: python radar.py

      - name: Save state
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add seen_alerts.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update seen alerts" && git push)
