name: Architect Vulnerability Radar

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests feedparser

      - name: Run Architect Radar
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: python radar.py

      - name: Save state
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add seen_alerts.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update seen alerts" && git push)
