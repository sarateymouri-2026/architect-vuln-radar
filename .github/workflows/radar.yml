name: Architect Vulnerability Radar

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Send sample alerts now to verify Slack delivery'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Restore seen alerts cache
        uses: actions/cache/restore@v4
        with:
          path: seen_alerts.json
          key: vuln-radar-state-${{ github.run_id }}
          restore-keys: |
            vuln-radar-state-

      - name: Install dependencies
        run: pip install requests feedparser

      - name: Run Architect Radar
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          TEST_MODE: ${{ github.event.inputs.test_mode || 'false' }}
        run: python radar.py

      - name: Save seen alerts cache
        uses: actions/cache/save@v4
        with:
          path: seen_alerts.json
          key: vuln-radar-state-${{ github.run_id }}
